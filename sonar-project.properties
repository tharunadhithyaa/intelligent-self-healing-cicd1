# ============================================================================
# SonarQube Community Build Configuration — Monorepo Architecture
# Project: intelligent-self-healing-cicd
# Reference Application: CivicPulse AI (Angular Frontend + Node.js/Express Backend)
# ============================================================================

# ── 1. Required Project Identifiers & Metadata ──────────────────────────────
# Unique key for the project in SonarQube server
sonar.projectKey=intelligent-self-healing-cicd

# Display name of the project in SonarQube UI
sonar.projectName=intelligent-self-healing-cicd

# Project version tracking (synced with release versioning)
sonar.projectVersion=1.0.0

# Encoding of source code files
sonar.sourceEncoding=UTF-8

# Disable SCM blame indexing to accelerate CI analysis speed and prevent agent timeouts
sonar.scm.disabled=true

# ── 2. Source Code & Monorepo Directory Definitions ────────────────────────
# Primary source paths for Node.js Backend, Angular Frontend, Jenkins Pipeline, and Nginx Proxy
sonar.sources=backend/src,frontend/src,jenkins,nginx

# File extensions included in static code security, quality, and DevOps analysis
sonar.inclusions=\
  **/*.ts,\
  **/*.js,\
  **/*.html,\
  **/*.css,\
  **/*.scss,\
  **/*.json,\
  **/*.sh,\
  **/*.conf,\
  **/*.groovy,\
  **/Jenkinsfile,\
  **/Dockerfile*,\
  **/*.dockerfile,\
  **/*.yml,\
  **/*.yaml

# ── 3. Comprehensive Exclusion Patterns ─────────────────────────────────────
# Excludes node_modules, dist, build, coverage, logs, and temporary artifacts 
# while preserving application code and DevOps automation scripts.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/logs/**,\
  **/*.log,\
  **/.git/**,\
  **/.angular/**,\
  **/.idea/**,\
  **/.vscode/**,\
  **/tmp/**,\
  **/temp/**,\
  **/jenkins/reports/**,\
  **/*.min.js,\
  **/*.min.css

# ── 4. Test Files Specification & Coverage Exclusions ───────────────────────
# Define unit test and integration test pattern matching
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js,\
  backend/src/tests/**

# Exclude test files, entry points, and environment configs from coverage calculation
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.spec.js,\
  **/*.test.js,\
  backend/src/tests/**,\
  **/main.ts,\
  **/environment*.ts,\
  **/environments/**,\
  **/test.ts

# ── 5. Framework & Language Specific Settings ───────────────────────────────
# Path to Angular tsconfig file for TypeScript type-checking analysis
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Location of code coverage reports (LCOV format generated by Jest/Karma)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
