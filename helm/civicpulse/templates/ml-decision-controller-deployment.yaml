{{- if and .Values.mlDecisionController (default true .Values.mlDecisionController.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicpulse-ml-decision-controller
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
    app.kubernetes.io/part-of: civicpulse-self-healing
spec:
  replicas: {{ .Values.mlDecisionController.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "civicpulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml-decision-controller
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.mlDecisionController.service.port | default 5000 }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "civicpulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ml-decision-controller
        app.kubernetes.io/part-of: civicpulse-self-healing
    spec:
      serviceAccountName: civicpulse-ml-decision-controller
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: ml-decision-controller
          image: "{{ .Values.mlDecisionController.image.repository }}:{{ .Values.mlDecisionController.image.tag }}"
          imagePullPolicy: {{ .Values.mlDecisionController.image.pullPolicy | default "Always" }}
          ports:
            - containerPort: {{ .Values.mlDecisionController.service.port | default 5000 }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.mlDecisionController.service.port | default 5000 | quote }}
          resources:
            {{- toYaml .Values.mlDecisionController.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mlDecisionController.service.port | default 5000 }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.mlDecisionController.service.port | default 5000 }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
{{- end }}
