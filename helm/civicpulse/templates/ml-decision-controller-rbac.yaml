{{- if and .Values.mlDecisionController (default true .Values.mlDecisionController.enabled) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: civicpulse-ml-decision-controller
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: civicpulse-ml-decision-controller-role
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: civicpulse-ml-decision-controller-binding
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: civicpulse-ml-decision-controller-role
subjects:
  - kind: ServiceAccount
    name: civicpulse-ml-decision-controller
    namespace: {{ .Values.namespace | default .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: civicpulse-ml-decision-controller-argocd-role
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: civicpulse-ml-decision-controller-argocd-binding
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-decision-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: civicpulse-ml-decision-controller-argocd-role
subjects:
  - kind: ServiceAccount
    name: civicpulse-ml-decision-controller
    namespace: {{ .Values.namespace | default .Release.Namespace }}
{{- end }}
