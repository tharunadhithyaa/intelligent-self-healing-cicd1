apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-grafana-dashboard-infra
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  civicpulse-infra-dashboard.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "K3s Active Pods in civicpulse Namespace",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "targets": [
            { "expr": "count(kube_pod_info{namespace=\"civicpulse\"})", "legendFormat": "Pods Count" }
          ]
        },
        {
          "title": "CivicPulse Pod Restarts",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "targets": [
            { "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"civicpulse\"})", "legendFormat": "Restarts" }
          ]
        },
        {
          "title": "Node CPU Usage (%)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "targets": [
            { "expr": "(1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[1m]))) * 100", "legendFormat": "Node CPU %" }
          ]
        },
        {
          "title": "CivicPulse Pod CPU Usage (cores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            { "expr": "sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=\"civicpulse\"}) by (pod)", "legendFormat": "{{ "{{" }}pod{{ "}}" }}" }
          ]
        },
        {
          "title": "CivicPulse Pod Memory Usage (Bytes)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{namespace=\"civicpulse\"}) by (pod)", "legendFormat": "{{ "{{" }}pod{{ "}}" }}" }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["civicpulse", "infrastructure", "k3s"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "CivicPulse Kubernetes Infrastructure",
      "uid": "civicpulse-k8s-infra"
    }
