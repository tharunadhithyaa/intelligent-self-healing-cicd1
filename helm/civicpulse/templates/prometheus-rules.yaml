{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: civicpulse-alert-rules
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "civicpulse.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: civicpulse.alerts
      rules:
        - alert: BackendDownCritical
          expr: up{job="civicpulse-backend"} == 0 or absent(up{job="civicpulse-backend"}) == 1
          for: 30s
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "CivicPulse Backend API is DOWN"
            description: "CivicPulse backend target has been unreachable or down for more than 30 seconds."

        - alert: HighErrorRateCritical
          expr: (sum(rate(civicpulse_http_errors_total[2m])) / sum(rate(civicpulse_http_requests_total[2m]))) > 0.05
          for: 1m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "CivicPulse High HTTP Error Rate (> 5%)"
            description: "HTTP 4xx/5xx error rate has exceeded 5% over the last 2 minutes."

        - alert: HighLatencyWarning
          expr: histogram_quantile(0.95, sum(rate(civicpulse_http_request_duration_seconds_bucket[2m])) by (le)) > 1.0
          for: 1m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "CivicPulse High P95 Response Latency (> 1s)"
            description: "95th percentile request latency has exceeded 1 second over the last 2 minutes."

        - alert: HighCPUWarning
          expr: (sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace="civicpulse", container="backend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="civicpulse", container="backend", resource="cpu"}) by (pod)) > 0.8
          for: 2m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "CivicPulse Backend High CPU Usage (> 80%)"
            description: "Backend pod CPU usage has exceeded 80% of limit for 2 minutes."

        - alert: HighMemoryWarning
          expr: (sum(container_memory_working_set_bytes{namespace="civicpulse", container="backend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="civicpulse", container="backend", resource="memory"}) by (pod)) > 0.8
          for: 2m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "CivicPulse Backend High Memory Usage (> 80%)"
            description: "Backend pod memory usage has exceeded 80% of limit for 2 minutes."

        - alert: PodRestartWarning
          expr: sum(increase(kube_pod_container_status_restarts_total{namespace="civicpulse"}[15m])) > 1
          for: 1m
          labels:
            severity: warning
            component: kubernetes
          annotations:
            summary: "CivicPulse Pod Restart Detected"
            description: "One or more pods in namespace civicpulse restarted in the last 15 minutes."
{{- end }}
