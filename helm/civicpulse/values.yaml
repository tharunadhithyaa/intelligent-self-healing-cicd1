# ============================================================================
# CivicPulseAI — Helm Values (Base / Template Configuration)
# ============================================================================
# NOTE FOR DEVELOPERS:
# The image `tag:` fields in this file on the `main` branch serve as default /
# fallback template values. You DO NOT need to manually edit `tag:` on `main`
# before running a Jenkins build.
#
# During pipeline execution, Jenkins automatically generates `${BUILD_NUMBER}`
# at runtime, builds container images tagged with `${BUILD_NUMBER}`, and updates
# `helm/civicpulse/values.yaml` directly on the `gitops` branch via `update-gitops.sh`.
# Argo CD monitors the `gitops` branch and deploys the updated state automatically.
# ============================================================================

namespace: civicpulse
createNamespaceResource: false

imagePullSecrets:
  - name: ghcr-secret

frontend:
  image:
    repository: ghcr.io/tharunadhithyaa/civicpulse-frontend
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

backend:
  image:
    repository: ghcr.io/tharunadhithyaa/civicpulse-backend
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1
  port: 3000
  env:
    nodeEnv: production
    corsOrigin: "http://localhost:4200"
    logLevel: info
    jwtAccessExpiry: 15m
    jwtRefreshExpiry: 7d
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mongodb:
  image:
    repository: ghcr.io/tharunadhithyaa/civicpulse-mongodb
    tag: "latest"
    pullPolicy: Always
  port: 27017
  database: civicpulse
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

nginx:
  image:
    repository: ghcr.io/tharunadhithyaa/civicpulse-nginx
    tag: "latest"
    pullPolicy: Always
  replicaCount: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

secret:
  create: true
  existingSecret: civicpulse-secret
  jwtAccessSecret: "civicpulse-ci-access-secret"
  jwtRefreshSecret: "civicpulse-ci-refresh-secret"
  defaultPassword: "CivicPulse@2026"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: civicpulse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
